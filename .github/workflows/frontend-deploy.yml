# .github/workflows/frontend-deploy.yml
name: React Frontend CI/CD

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # Configure the production repository secrets and variables in GitHub.
      REACT_APP_API_URL: ${{ secrets.PROD_API_URL }}
      REACT_APP_WS_URL: ${{ secrets.PROD_WS_URL }}
      REACT_APP_POSTHOG_HOST: ${{ secrets.PROD_POSTHOG_HOST }}
      REACT_APP_POSTHOG_KEY: ${{ secrets.PROD_POSTHOG_KEY }}
      REACT_APP_POSTHOG_UI_HOST: ${{ vars.PROD_POSTHOG_UI_HOST }}

    steps:
      # 1. Checkout your code
      - name: Checkout repo
        uses: actions/checkout@v3
      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22.16.0

      # 3. Install deps & build production bundle
      - name: Install dependencies & build
        run: |
          test -n "$REACT_APP_POSTHOG_HOST" || { echo "Missing PROD_POSTHOG_HOST"; exit 1; }
          test -n "$REACT_APP_POSTHOG_KEY" || { echo "Missing PROD_POSTHOG_KEY"; exit 1; }
          test -n "$REACT_APP_POSTHOG_UI_HOST" || { echo "Missing PROD_POSTHOG_UI_HOST"; exit 1; }
          npm ci --legacy-peer-deps
          npm run typecheck
          CI=true npm test -- --watchAll=false --runInBand
          npm run build
        # REACT_APP_* vars are injected above, so the build picks up your prod URLs

      - name: Verify PostHog proxy before deployment
        run: python3 .github/scripts/verify_posthog_proxy.py

      # 4. Configure AWS CLI
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 5. Sync build output to S3
      - name: Deploy build to S3
        run: |
          aws s3 sync build/ s3://${{ secrets.S3_BUCKET_NAME }} \
            --delete

      # 6. Invalidate CloudFront to serve fresh assets
      - name: Invalidate CloudFront cache
        run: |
          invalidation_id=$(aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --id "$invalidation_id"
